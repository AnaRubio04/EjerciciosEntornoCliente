<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script src="formulario.js" defer type="module"></script>
    <link rel="stylesheet" href="formulario.css" />
  </head>
  <body>
    <header>
      <h1>Mi primer formulario</h1>
      <main>
        <form action="" method="get">
          <label for="idNombre">Introduce tu nombre </label>
          <input type="text " id="idNombre" autocomplete="given-name" />

          <label for="idApellido">Introduce tu apellido </label>
          <input type="text " id="idApellido" />

          <label for="idEdad">Introduce tu edad </label>
          <input type="text " id="idEdad" />

          <label for="idLocalizacion">Introduce tu localizacion </label>
          <input type="text " id="idLocalizacion" />

          <label for="idNombre">Correo: </label>
          <input type="text " id="idCorreo" />

          <input type="submit " />
        </form>
      </main>
    </header>
  </body>
</html>
