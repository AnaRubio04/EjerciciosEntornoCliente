<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREAR INCIDENCIA</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="crear.js" defer></script>
</head>
<body>
    <header>
        <h1>Crear incidencia</h1>
    </header>
    <main>
        <section>
            <h2>Nueva incidencia </h2>
            <form id="formulario">
                <label for="titulo">Titulo:</label>
                <input type="text" name="titulo" id="titulo" required>

                <label for="descripcion">Descripcion:</label>
                <input type="text" name="descripcion" id="descripcion" required>

                <label for="equipo">Equipo:</label>
                <input type="text" name="equipo" id="equipo" required>


                <label for="prioridad">Prioridad:</label>
                <select name="" id="prioridad" required>
                    <option value="">Selecciona una prioridad</option>
                    <option value="baja">Baja</option>
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                </select>

                <label for="fecha">Fecha:</label>
                <input type="date" name="fecha" id="fecha" required>

                 <input type="submit" value="Crear incidencia">

            </form>

        </section>
        <a href="consultar.html">Consultar incidencias</a>
        <br>
        <a href="index.html">Volver a la página principal</a>
    </main>
</body>
</html>
