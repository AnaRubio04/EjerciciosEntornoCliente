<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Trenes</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>

    <main class="contenedor">

        <h1>Thomas y sus Amigos: Gestor de Trenes</h1>

        <section>
            <h2>Registrar Nuevo Tren</h2>

            <form id="formularioTren">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required>

                <label for="tipo">Tipo</label>
                <select id="tipo"></select>

                <label for="velocidad">Velocidad máxima (km/h)</label>
                <input
                    type="number"
                    id="velocidad"
                    min="10"
                    max="300"
                    required
                >

                <input type="submit" value="Añadir Tren">

            </form>

            <p id="mensajeRegistro"></p>
        </section>

        <section>
            <h2>Simulador de Viajes</h2>

            <label for="origen">Estación Origen</label>
            <select id="origen"></select>

            <label for="destino">Estación Destino</label>
            <select id="destino"></select>

            <label for="trenSeleccionado">Selecciona Tren</label>
            <select id="trenSeleccionado"></select>

            <input
                type="button"
                id="simular"
                value="Simular Viaje"
            >

            <div id="resultadoViaje"></div>
        </section>

        <section>
            <h2>Listado de Trenes</h2>

            <input
                type="search"
                id="busqueda"
                placeholder="Buscar por nombre o tipo..."
            >

            <input
                type="button"
                id="buscar"
                value="Buscar"
            >

            <input
                type="button"
                id="mostrarTodos"
                value="Mostrar todos"
            >

            <div id="listaTrenes"></div>

            <input
                type="button"
                id="borrarTodos"
                value="Borrar Todos los Trenes"
            >
        </section>

    </main>

</body>
</html>
