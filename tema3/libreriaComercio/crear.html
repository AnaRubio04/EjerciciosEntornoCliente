<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Libro</title>
    <link rel="stylesheet" href="libreria.css" />
    <script src="libreria.js" defer type="module"></script>
  </head>
  <body>
    <header>
      <img src="#" onclick="home.html" />
      <h1>Librería Comercio</h1>
    </header>
    <main>
      <form action="" method="get">
        <label for="idNombre">Introduce tu nombre </label>
        <input type="text " id="idNombre" autocomplete="given-name" />

        <label for="idNombreAutor">Introduce el nombre del autor </label>
        <input type="text " id="idAutor" />

        <label for="idNumPag">Introduce el numero de páginas </label>
        <input type="text " id="idNumPag" />

        <input type="checkbox" id="prestado" name="RememberPreferences" />
        <label for="prestado">Prestado</label>

        <input class="styled" type="button" value="Crear" />
      </form>
    </main>
  </body>
</html>
