<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Libro</title>
  <link rel="stylesheet" href="libreria.css" />
  <script src="libreria.js" defer type="module"></script>
</head>

<body>
  <header>
    <img src="#" onclick="home.html" />
    <h1>Librería Comercio</h1>
  </header>
  <main>
    <form id="formulario">
      <label for="idNombre">Introduce el nombre del libro</label>
      <input type="text" id="idNombre" required />

      <label for="idAutor">Introduce el nombre del autor</label>
      <input type="text" id="idAutor" required />

      <label for="idNumPag">Introduce el número de páginas</label>
      <input type="number" id="idNumPag" min="1" required />

      <input type="checkbox" id="prestado" />
      <label for="prestado">Prestado</label>

      <button type="submit">Crear</button>
    </form>
  </main>
</body>

</html>
