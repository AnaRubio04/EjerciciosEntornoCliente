<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de trenes</title>

    <script
        src="app.js"
        defer
    ></script>
</head>

<body>

    <h1>Gestión de trenes</h1>


    <label for="filtroEstado">
        Filtrar por estado:
    </label>

    <select id="filtroEstado">

        <option value="todos">
            Todos
        </option>

        <option value="puntual">
            Puntual
        </option>

        <option value="retrasado">
            Retrasado
        </option>

    </select>


    <br><br>


    <label for="buscarId">
        Buscar tren por ID:
    </label>

    <input
        type="number"
        id="buscarId"
    >

    <input
        type="button"
        id="botonBuscar"
        value="Buscar"
    >


    <br><br>


    <input
        type="button"
        id="eventoAleatorio"
        value="Generar evento aleatorio"
    >


    <p id="mensaje"></p>


    <h2>Trenes</h2>

    <div id="listaTrenes"></div>


</body>

</html>
